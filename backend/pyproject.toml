[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coastal-dss"
version = "0.1.0"
description = "GIS-based decision-support framework for coastal vulnerability assessment under relative sea level rise, Lagos, Nigeria"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "numpy>=1.26",
  "scipy>=1.11",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.4"]
geo = ["rasterio>=1.3", "geopandas>=0.14", "pyproj>=3.6", "shapely>=2.0"]
jobs = ["celery>=5.3", "redis>=5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
coastal_dss = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
